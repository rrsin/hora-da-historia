# Use this on the Raspberry Pi once CI has pushed images to GHCR, so the
# Pi only has to `docker compose pull` instead of compiling
# better-sqlite3 on-device. 
# rrsin/hora-da-historia (lowercase).
services:
  server:
    image: ghcr.io/rrsin/hora-da-historia-server:latest
    restart: unless-stopped
    volumes:
      - stories-data:/app/data
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DB_PATH=/app/data/stories.db

  client:
    image: ghcr.io/rrsin/hora-da-historia-client:latest
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  stories-data:
