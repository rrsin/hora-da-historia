server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA routing - fall back to index.html for any unknown path
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Forward API calls to the server container. "server" is the service
  # name in docker-compose.yml, resolved via Docker's internal DNS.
  location /api/ {
    proxy_pass http://server:4000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
